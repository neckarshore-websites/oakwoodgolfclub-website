version: 2

# Keeps dependencies + SHA-pinned Actions current. The github-actions
# ecosystem is what maintains the commit-SHA pins added in the #270
# hardening pass (a tag pin would not satisfy scorecard Pinned-Dependencies;
# Dependabot bumps the SHA + version comment together).

updates:
  - package-ecosystem: npm
    directory: "/"
    # 3-day cooldown (Founder 2026-10-23, dev-environment #296): a release is
    # only proposed once it has been public for 3 days, so a pulled or
    # compromised release has time to be noticed before it is auto-merged.
    # Security updates are not delayed by cooldown.
    cooldown:
      default-days: 3
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    ignore:
      # @types/node beschreibt die Schnittstellen EINER Node-Version. Vercel faehrt
      # dieses Projekt auf Node 24.x (Projekteinstellung nodeVersion), die CI seit
      # 2026-09-18 ebenfalls. Ein Major-Vorschlag zieht die Typen auf eine Laufzeit,
      # die wir nicht haben — tsc waere dann gruen ueber Funktionen, die auf dem
      # Server fehlen. Minor und Patch innerhalb der 24er-Linie kommen weiter.
      #
      # ENTFERNUNGSKRITERIUM (sonst steht diese Zeile in zwei Jahren noch hier):
      # Sobald Vercels nodeVersion auf eine hoehere Linie gestellt wird, faellt diese
      # Ausnahme weg und @types/node zieht in einem Zug mit nach.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      # Grouping aligned with the auto-merge safe class (dependabot-auto-merge.yml)
      # so the boring class self-clears atomically and only the review-worthy bumps
      # surface individually:
      #   - npm-development: dev deps, minor+patch  -> auto (minor&&dev, or patch)
      #   - npm-production:  prod deps, patch only   -> auto (patch)
      #   - runtime minor (prod, minor): ungrouped -> individual PR -> MANUAL
      #   - any major:                   npm-major (one PR) -> MANUAL (#296, 2026-10-23)
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-production:
        dependency-type: production
        update-types:
          - patch
      # Majors, grouped (MASCHIN architect 2026-10-23, #296): one PR per ecosystem's
      # majors instead of one each. Still manual, never auto-merged: the
      # safe class excludes semver-major. LAST so the named groups above
      # keep their own majors. The @types/node major ignore above still applies.
      npm-major:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: "/"
    # 3-day cooldown (Founder 2026-10-23, dev-environment #296): a release is
    # only proposed once it has been public for 3 days, so a pulled or
    # compromised release has time to be noticed before it is auto-merged.
    # Security updates are not delayed by cooldown.
    cooldown:
      default-days: 3
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: chore(ci)
    groups:
      # CodeQL's init and analyze are the SAME action at the same SHA and must move
      # together. Grouping them across ALL update-types (majors included) is the point:
      # ungrouped, a major arrives as two PRs that each break the pair, and neither can
      # ever pass. Review is NOT weakened — the combined PR is still a major, and the
      # adopted policy holds ALL github-actions majors to manual review (major -> manual
      # wins universally, no per-action name list). A human still merges it.
      #
      # Declared BEFORE github-actions-minor-patch: the "*" pattern below would otherwise
      # swallow the codeql entries if Dependabot applies first-match-wins on overlap.
      codeql-action:
        patterns:
          - "github/codeql-action*"
        update-types:
          - major
          - minor
          - patch

      # Non-major actions bumps batch into one auto-mergeable PR; actions MAJORS batch
      # into actions-major below (#296), which stays manual — except codeql, which the
      # group above keeps together across majors (it is declared first and keeps them).
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

      # Majors, grouped (MASCHIN architect 2026-10-23, #296). Still manual. LAST, so
      # codeql-action above keeps its own majors.
      actions-major:
        patterns:
          - "*"
        update-types:
          - major
