name: AI Surface Monitoring

# JK-15 — weekly trend detector across 4 AI providers.
# DORMANT until the 4 API-key secrets are set (see tests/ai-surface/README.md).

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

# Least-privilege: top-level read-only; the single job elevates only the
# writes it actually needs (publish the report + open a regression issue).
permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the weekly report to the ai-surface-data branch
      issues: write # open a regression issue on detected drift
    steps:
      # Default persist-credentials (true) — the publish step below pushes to the
      # UNPROTECTED ai-surface-data branch via this job's contents:write GITHUB_TOKEN.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Restore the report history into the workspace BEFORE the run. This step is not
      # cosmetic: tests/ai-surface/run.ts (loadPrevious) picks the newest *-raw.json sitting
      # in docs/reports/ai-surface/ and diffs against it. main only carries the three seed
      # reports up to 2026-06-29, so without this step every future run would compare against
      # June forever and report "no regression" on a permanently stale baseline — a silent
      # failure, and strictly worse than the loud one this change removes.
      # Union semantics on purpose: the data branch is laid OVER main's seeds, never wipes them.
      # FAIL CLOSED. The first draft of this step swallowed every fetch error with `|| true`
      # and then fell through to main's June seeds — which would have reproduced, inside the
      # error path, the exact silent stale-baseline failure this step exists to prevent
      # (CodeRabbit on PR #134). Only a CONFIRMED absent branch is the first-run case; an
      # auth, network or server failure stops the job instead of quietly comparing to June.
      # ls-remote exit codes, measured: 0 = branch present, 2 = no matching ref, 128 = the
      # remote could not be reached or read.
      - name: Restore report history from the ai-surface-data branch
        run: |
          set -euo pipefail
          mkdir -p docs/reports/ai-surface
          set +e
          git ls-remote --exit-code --heads origin ai-surface-data >/dev/null 2>&1
          rc=$?
          set -e
          case "$rc" in
            0)
              # Branch exists — from here a failure is a real failure, never a first run.
              git fetch origin +refs/heads/ai-surface-data:refs/remotes/origin/ai-surface-data
              git archive origin/ai-surface-data | tar -x -C docs/reports/ai-surface
              echo "Restored history from ai-surface-data:"
              ;;
            2)
              echo "ai-surface-data does not exist yet (first run) — using the seeds on main:"
              ;;
            *)
              echo "::error::git ls-remote failed (exit $rc). Refusing to run: without the report history the monitor would silently compare against the stale seeds on main and report no regression."
              exit 1
              ;;
          esac
          ls -1 docs/reports/ai-surface/

      - name: Run AI-surface monitor
        run: npm run test:ai-surface
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}

      # ORDER IS LOAD-BEARING — DO NOT MOVE THIS BELOW THE PUBLISH STEP.
      # The alarm must not ride on the transport of its own report. Until 2026-08-28 this step
      # sat behind a plain push to protected main: the push was rejected every week, this step
      # went to `skipped`, and the monitor ran eight weeks with a dead alarm on a customer site
      # (neckarshore-planning#1988). Firing the alarm BEFORE the publish, and guarding it with
      # always(), means a broken publish path can no longer swallow a real regression.
      # The summary read here is written into the workspace by the monitor step, not by a commit.
      - name: Open issue on regression
        if: always() && env.HAS_REGRESSION == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('docs/reports/ai-surface/_latest-summary.md', 'utf8');
            const date = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `AI-Surface Regression — ${date}`,
              body,
              labels: ['ai-surface-regression', 'P2'],
            });

      # Publish to the UNPROTECTED `ai-surface-data` branch — never main. main is protected by
      # four required checks, and the previous plain push from this step was rejected by that
      # protection every single week. The protection was right; this job was wrong to go that
      # way at all.
      #
      # Built with git PLUMBING (hash-object -> mktree -> commit-tree -> push), mirroring the
      # emit-stats publisher in e2e.yml. A `git checkout` to the data branch would abort: it
      # shares no history with main, so git treats every main file as "would be overwritten".
      # Plumbing never touches the working tree — it writes blobs + one flat tree + one commit
      # and pushes the ref. The tree is FLAT (report files at the branch root), which is exactly
      # what the restore step above relies on: `git archive | tar -x` into the report dir then
      # lands the files where loadPrevious() looks.
      - name: Publish the report to the ai-surface-data branch
        if: always()
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"
        run: |
          set -euo pipefail
          # mktree does NOT sort its input; unsorted entries produce a malformed tree.
          TREE=$(cd docs/reports/ai-surface && for f in *; do
                   [ -f "$f" ] || continue
                   printf '100644 blob %s\t%s\n' "$(git hash-object -w "$f")" "$f"
                 done | LC_ALL=C sort | git mktree)
          MSG="chore(ai-surface): weekly monitoring report @ ${GITHUB_SHA:0:7}"
          if git rev-parse --verify origin/ai-surface-data >/dev/null 2>&1; then
            if [ "$TREE" = "$(git rev-parse origin/ai-surface-data^{tree})" ]; then
              echo "Report tree unchanged — nothing to publish."
              exit 0
            fi
            COMMIT=$(git commit-tree "$TREE" -p origin/ai-surface-data -m "$MSG")
          else
            COMMIT=$(git commit-tree "$TREE" -m "$MSG")
          fi
          # Belt: a push with an EMPTY source refspec (":refs/heads/ai-surface-data") is a
          # DELETE command. set -e already aborts on a failed commit-tree substitution; this is
          # the explicit guard so a branch deletion can never depend on implicit -e.
          [ -n "$COMMIT" ] || { echo "::error::commit-tree produced no commit — refusing to publish (would delete ai-surface-data)"; exit 1; }
          git push origin "${COMMIT}:refs/heads/ai-surface-data"
